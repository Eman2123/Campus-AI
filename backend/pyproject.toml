[project]
name = "campus-ai-backend"
version = "0.1.0"
description = "Campus AI - multi-agent study assistant API"
requires-python = ">=3.11"
# Mirrors requirements.txt (kept in sync by hand) so FastAPI Cloud / uv can
# install the app from pyproject.toml.
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "redis==5.0.8",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
    "langgraph==1.2.11",
    "langchain-core==1.6.2",
    "openai==3.9.0",
    "assemblyai==1.3.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "psycopg-pool>=3.2.3,<4.0.0",
    "pytest==9.1.1",
    "pgvector",
    "pypdf==6.18.0",
    "python-docx==1.2.0",
    "python-dateutil",
    "icalendar==5.0.13",
    "apscheduler==3.10.4",
    "httpx==0.27.2",
    "google-api-python-client==2.149.0",
    "google-auth==2.35.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
