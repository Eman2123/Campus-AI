[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-ai-backend"
version = "0.1.0"
description = "Campus AI - multi-agent study assistant API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]",  # <-- Yahan [standard] add kar dein
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-multipart",
    "python-dotenv",
    "email-validator",
    "langgraph",
    "langchain-core",
    "openai",
    "assemblyai",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "psycopg-pool>=3.2.3,<4.0.0",
    "pgvector",
    "pypdf",
    "python-docx",
    "python-dateutil",
    "icalendar",
    "apscheduler",
    "httpx",
    "google-api-python-client",
    "google-auth",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
markers = ["live: calls the real LLM/embedding API; run with `pytest -m live`"]
addopts = "-m 'not live'"