[project]
name = "campus-ai-backend"
version = "0.1.0"
description = "Campus AI - multi-agent study assistant API"
# Pinned below 3.13 on purpose: several pinned dependencies (asyncpg 0.29,
# pydantic-core 2.23) have no prebuilt wheels for 3.13/3.14 and fail to compile
# on FastAPI Cloud. 3.12 is what local dev and CI use.
requires-python = ">=3.12,<3.13"
# Mirrors requirements.txt (kept in sync by hand) so FastAPI Cloud / uv can
# install the app from pyproject.toml.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "redis==8.1.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.4",
    "email-validator==2.3.0",
    "langgraph==1.2.15",
    "langchain-core==1.6.10",
    "openai==3.29.0",
    "assemblyai==1.6.1",
    "langgraph-checkpoint-postgres==3.1.3",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "psycopg-pool>=3.2.3,<4.0.0",
    "pytest==9.1.1",
    "pgvector==0.5.1",
    "pypdf==6.20.1",
    "python-docx==1.2.0",
    "python-dateutil==2.9.0.post0",
    "icalendar==7.3.0",
    "apscheduler==3.11.3",
    "httpx==0.28.1",
    "google-api-python-client==2.201.0",
    "google-auth==2.62.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
# `live` tests call the real LLM / embedding API (needs AIML_API_KEY in .env,
# costs a little, can be slow or vary run to run). Skipped by default; run
# them with:  pytest -m live
markers = ["live: calls the real LLM/embedding API; run with `pytest -m live`"]
addopts = "-m 'not live'"
